# 윈도우 exe 설치파일 자동 빌드
# - main에 올리면: 새 버전(1.0.실행번호)으로 Releases에 exe + 업데이트 정보(latest.json) 등록
#   → 설치된 앱이 켜질 때 새 버전을 확인하고 업데이트를 물어봄
# - 다른 브랜치: exe만 빌드해서 Actions 결과물(Artifacts)로 보관 (테스트용)
name: Windows exe

on:
  push:
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm install

      - name: 버전 번호 정하기
        shell: bash
        run: |
          node -e "
            const fs=require('fs'); const f='src-tauri/tauri.conf.json';
            const c=JSON.parse(fs.readFileSync(f,'utf8'));
            c.version='1.0.${{ github.run_number }}';
            if (process.env.HAS_KEY!=='true') c.bundle.createUpdaterArtifacts=false;
            fs.writeFileSync(f, JSON.stringify(c,null,2));
            console.log('version', c.version, 'updater', c.bundle.createUpdaterArtifacts);"

      - name: 빌드 + 릴리스 (main)
        if: github.ref == 'refs/heads/main'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        with:
          tagName: v__VERSION__
          releaseName: 메트로놈 v__VERSION__
          releaseBody: 'Metronome_..._x64-setup.exe 를 받아 실행하세요. 이미 설치했다면 앱을 켤 때 자동으로 업데이트를 물어봅니다.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      - name: 빌드만 (테스트 브랜치)
        if: github.ref != 'refs/heads/main'
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''

      - name: exe 보관 (테스트 브랜치)
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: metronome-setup
          path: src-tauri/target/release/bundle/nsis/*.exe
